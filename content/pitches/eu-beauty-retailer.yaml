# Mock pitch: a first call with a European beauty retailer about short video and live shopping.
# Fjordbloom stands in for the prospect's own store. Keep this file public-safe: no prices,
# customer names, internal processes or figures that are not in Firework's public material.
# Shown at /pitch (overview) and /pitch/eu-beauty-retailer (presenter notes).
id: eu-beauty-retailer
order: 1
title: EU beauty retailer, first call
audience: E-commerce and brand team of a mid-size European beauty retailer that sells online in several markets.
length: 30 minutes
goal: Show how shoppable short video and live shopping fit their store, and agree on a technical follow-up.

before:
  - Make sure the livestream playlist has an upcoming show or a replay, so the hero unit and the Live page have content.
  - For the showroom step, add a one-time restream that starts a few minutes into the call, so Copilot can answer live.
  - Empty the demo bag, so the checkout step starts clean.
  - Open Business Portal in a second tab with the video library, one video's tagged products and Insights ready.
  - Share only the demo tab. Keep these notes in a separate window that you don't share.
  - Turn off notifications on the computer you share from.

discovery:
  - Which commerce platform runs the store, and who builds the front end?
  - Which markets and languages do you sell in?
  - What video do you already make? Tutorials, creator content, social clips?
  - Who could host a live show, and how often?
  - How do you handle cookie consent today?
  - Which result would make this a success? Conversion rate, order value, time on site or fewer returns?

steps:
  - title: Agenda and discovery
    minutes: 4
    show:
      - Keep the home page on screen while you talk.
    say:
      - Five minutes on your goals, fifteen minutes of demo, ten for questions and next steps.
      - Work through the discovery questions. Note the platform, markets and consent setup for the follow-up.
    ask: What made you look at shoppable video now?

  - title: Shoppable video on the home page
    path: /
    minutes: 4
    show:
      - Scroll to the Storyblock and let a video play with sound off.
      - Point at the product cards inside the video, then tap one to show the product.
      - Scroll on to the carousel. It uses the same video library in another layout.
    say:
      - Shoppers watch and shop in one place, without leaving the page.
      - One video library feeds the home page, category pages and product pages.
      - Videos start muted, as browsers require for autoplay, and shoppers turn sound on with one tap.

  - title: Videos that follow the product
    path: /products/cloudberry-vitamin-c-serum
    minutes: 4
    show:
      - Scroll to "Videos featuring Cloudberry C Serum". It only shows videos tagged with this product.
      - Open a second product page to show that its videos change on their own.
      - Scroll to the Player Deck below.
      - In "Questions about Cloudberry C Serum", ask the AI assistant "Can I use it with retinol?".
    say:
      - Tag a product in a video once, and every page for that product shows it. Nobody edits product pages by hand.
      - AVA, the AI assistant, answers from the product page, the brand's policies and the catalog.
      - Products come from your feed, which Firework syncs on a schedule.
    ask: How does your team add video to product pages today?

  - title: Category grid
    path: /shop
    minutes: 2
    show:
      - The video grid between the product rows.
    say:
      - The same videos again, in a grid that fits a category page.
      - Your team picks the layout in Business Portal and copies one embed snippet.

  - title: Live shopping and replays
    path: /live
    minutes: 4
    show:
      - The hero unit, which shows a countdown, the live show or the replay.
      - Open the replay and point at the pinned products.
    say:
      - A live show sells while it runs and keeps selling as a replay.
      - You can stream from OBS, from a phone with the Firework Camera App, or schedule a prerecorded video.
      - A prerecorded first show needs no studio and no live host.
    ask: Who on your team could host a monthly show?

  - title: Always-on showroom with an AI co-host
    path: /showroom
    minutes: 2
    show:
      - The next-session line and the hero unit with the daily restream.
      - If a session is running, type a question in the chat, such as "Is the serum vegan?", and wait for the AI reply.
    say:
      - One recorded show runs again every evening, so there is a live moment without a host or a studio.
      - AI Copilot answers the chat from the brand's product and policy knowledge, the same knowledge as AVA.
    ask: How many questions does your team answer by hand today?

  - title: Checkout and measurement
    path: /cart
    minutes: 3
    show:
      - Check out with the item in the bag. The checkout never asks for payment details.
      - On the confirmation page, point at the purchase event and its payload.
    say:
      - The order page tells Firework what was bought, so Insights can link sales to videos and shows.
      - The event carries the order ID, amounts and product SKUs, not the shopper's name or address.

  - title: Behind the scenes in Business Portal
    minutes: 2
    show:
      - Switch to the Business Portal tab. Show the video library, a video's tagged products, a playlist and Insights.
    say:
      - Uploading, tagging and arranging videos is no-code work for the e-commerce team.
      - Developers add the embed once. After that, playlists change what shoppers see without a release.

  - title: Next steps
    path: /
    minutes: 5
    show:
      - Go back to the home page and stop sharing when questions begin.
    say:
      - Recap the two or three moments that got the strongest reaction.
      - Propose a technical call with their developer about the platform, consent and the product feed.
      - Suggest a first live show date and two or three pages to start with.
    ask: Who else should join the next call?
