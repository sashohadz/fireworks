[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Whole site: keep it out of search results (it is a demo, not a real shop),
# and allow same-origin framing, which Firework picture-in-picture needs.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "frame-ancestors 'self'"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

# Mock commerce API: readable from CodePen, the mobile SDK workshop and other origins.
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=60"

# Product feeds that Firework imports (Google XML auto-sync and CSV).
[[headers]]
  for = "/feeds/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
