buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// From Firework's React Native sample app: the React Native Gradle plugin adds the old OSSRH snapshots repository
// (oss.sonatype.org) to every module. Firework's Glide artifact uses a dynamic version range, so Gradle asks every
// repository for versions, and a 504 from that retired host aborts the build. This app never uses nightlies.
gradle.projectsEvaluated {
    allprojects { p ->
        p.repositories.removeAll { repo ->
            repo.hasProperty('url') && repo.url?.toString()?.contains('oss.sonatype.org')
        }
    }
}
